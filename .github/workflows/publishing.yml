name: Publish signed pacman repository to GitHub Pages

on:
  workflow_run:
    workflows:
      - Automatically build and release CachyOS KWin NO-TILES
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kwin-no-tiles-pacman-pages
  cancel-in-progress: false

jobs:
  publish:
    # Only publish after a successful run of the existing build/release workflow.
    # Manual runs are also allowed for recovery/republication.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$GPG_PRIVATE_KEY" ]] || { echo "::error::GPG_PRIVATE_KEY is empty"; exit 1; }
          [[ -n "$GPG_FINGERPRINT" ]] || { echo "::error::GPG_FINGERPRINT is empty"; exit 1; }
          # The passphrase may legitimately be empty for an unprotected key.

      - name: Download the two newest successful release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/x86_64 site/keys
          mapfile -t tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt               --jq 'map(select((.tagName | startswith("kwin-no-tiles-")) and (.tagName | endswith("-cachyos-v3")))) | sort_by(.publishedAt) | reverse | .[0:2][] | .tagName'
          )
          if [[ "${#tags[@]}" -eq 0 ]]; then
            echo "::error::No successful KWin NO-TILES releases exist yet. Run the build/release workflow successfully first."
            exit 1
          fi
          for tag in "${tags[@]}"; do
            echo "Downloading package from $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.pkg.tar.zst' --dir site/x86_64
          done
          shopt -s nullglob
          packages=(site/x86_64/*.pkg.tar.zst)
          [[ "${#packages[@]}" -ge 1 && "${#packages[@]}" -le 2 ]] || {
            echo "::error::Expected one or two release packages; found ${#packages[@]}."
            exit 1
          }
          # Prevent stale package files from silently entering the repository.
          printf '%s\n' "${packages[@]}"

      - name: Build and sign the pacman repository
        shell: bash
        run: |
          set -euo pipefail
          # Use Arch's repo-add so the database is generated in the native format.
          docker run --rm --user 0:0 \
            --volume "$GITHUB_WORKSPACE/site:/site" \
            --env GPG_PRIVATE_KEY \
            --env GPG_PASSPHRASE \
            --env GPG_FINGERPRINT \
            archlinux:latest bash -euo pipefail -c '
              pacman -Sy --noconfirm --needed gnupg pacman-contrib
              install -d -m 700 /root/.gnupg
              printf "%s" "$GPG_PRIVATE_KEY" | gpg --batch --import
              actual="$(gpg --batch --with-colons --fingerprint "$GPG_FINGERPRINT" | awk -F: '\''$1 == "fpr" { print $10; exit }'\'')"
              [[ -n "$actual" && "$actual" == "$GPG_FINGERPRINT" ]] || {
                echo "GPG fingerprint does not match the imported key" >&2
                exit 1
              }
              if [[ -n "$GPG_PASSPHRASE" ]]; then
                printf "%s" "$GPG_PASSPHRASE" > /tmp/gpg-passphrase
                chmod 600 /tmp/gpg-passphrase
                export GPG_TTY=/dev/null
                # Configure loopback pinentry for non-interactive signing.
                printf "%s\\n" "allow-loopback-pinentry" > /root/.gnupg/gpg-agent.conf
                gpgconf --kill gpg-agent || true
                gpg --batch --pinentry-mode loopback --passphrase-file /tmp/gpg-passphrase --local-user "$GPG_FINGERPRINT" --detach-sign --output /tmp/signing-test.sig /dev/null
                rm -f /tmp/signing-test.sig /tmp/gpg-passphrase
              fi
              cd /site/x86_64
              shopt -s nullglob
              packages=(*.pkg.tar.zst)
              [[ "${#packages[@]}" -ge 1 && "${#packages[@]}" -le 2 ]]
              for package in "${packages[@]}"; do
                if [[ -n "$GPG_PASSPHRASE" ]]; then
                  gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --local-user "$GPG_FINGERPRINT" --detach-sign "$package"
                else
                  gpg --batch --yes --local-user "$GPG_FINGERPRINT" --detach-sign "$package"
                fi
              done
              if [[ -n "$GPG_PASSPHRASE" ]]; then
                repo-add --sign --key "$GPG_FINGERPRINT" --passphrase "$GPG_PASSPHRASE" kwin-no-tiles.db.tar.gz "${packages[@]}"
              else
                repo-add --sign --key "$GPG_FINGERPRINT" kwin-no-tiles.db.tar.gz "${packages[@]}"
              fi
              # Export the public key so clients can import it into pacman-key.
              gpg --batch --armor --export "$GPG_FINGERPRINT" > /site/keys/kwin-no-tiles-signing-key.asc
              gpg --batch --export "$GPG_FINGERPRINT" > /site/keys/kwin-no-tiles-signing-key.gpg
            '

      - name: Create repository instructions
        shell: bash
        run: |
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>KWin NO-TILES CachyOS pacman repository</title>
          </head>
          <body>
            <h1>KWin NO-TILES for CachyOS</h1>
            <p>This is the signed x86_64 pacman repository for KWin NO-TILES built for CachyOS x86-64-v3.</p>
            <h2>Signing key</h2>
            <p><a href="keys/kwin-no-tiles-signing-key.asc">Download the public signing key (ASCII armored)</a></p>
            <p>Verify the fingerprint against the maintainer-published fingerprint before trusting the key.</p>
            <h2>Repository configuration</h2>
            <p>Repository setup instructions will be published here after the first successful deployment and fingerprint verification.</p>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

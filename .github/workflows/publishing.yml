name: Publish signed pacman repository to GitHub Pages

on:
  workflow_run:
    workflows:
      - Automatically build and release CachyOS KWin NO-TILES
    types:
      - completed
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publishing.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kwin-no-tiles-pacman-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download the two newest signed release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/x86_64 site/keys
          mapfile -t tags < <(
            gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
              --jq 'map(select((.tagName | startswith("kwin-no-tiles-")) and (.tagName | endswith("-cachyos-v3")))) | sort_by(.publishedAt) | reverse | .[0:2][] | .tagName'
          )
          [[ "${#tags[@]}" -ge 1 ]] || {
            echo "::error::No KWin NO-TILES releases exist. The build/release workflow must publish one first."
            exit 1
          }
          for tag in "${tags[@]}"; do
            echo "Downloading signed package assets from $tag"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern '*.pkg.tar.zst' \
              --pattern '*.pkg.tar.zst.sig' \
              --dir site/x86_64
          done
          shopt -s nullglob
          packages=(site/x86_64/*.pkg.tar.zst)
          [[ "${#packages[@]}" -ge 1 && "${#packages[@]}" -le 2 ]] || {
            echo "::error::Expected one or two package versions; found ${#packages[@]}."
            exit 1
          }
          for package in "${packages[@]}"; do
            [[ -s "${package}.sig" ]] || {
              echo "::error::Missing detached package signature for ${package##*/}."
              exit 1
            }
          done
          # Use key details from the newest release and verify they match the configured signing key.
          mkdir -p "$RUNNER_TEMP/kwin-signing-key"
          gh release download "${tags[0]}" --repo "$GITHUB_REPOSITORY" \
            --pattern 'kwin-no-tiles-signing-key.asc' \
            --pattern 'GPG_FINGERPRINT.txt' \
            --dir "$RUNNER_TEMP/kwin-signing-key"
          install -m 0644 "$RUNNER_TEMP/kwin-signing-key/kwin-no-tiles-signing-key.asc" site/keys/kwin-no-tiles-signing-key.asc
          install -m 0644 "$RUNNER_TEMP/kwin-signing-key/GPG_FINGERPRINT.txt" site/GPG_FINGERPRINT.txt

      - name: Verify release signatures and build signed repository database
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          set -euo pipefail
          [[ -n "$GPG_PRIVATE_KEY" && -n "$GPG_FINGERPRINT" ]] || {
            echo "::error::GPG_PRIVATE_KEY and GPG_FINGERPRINT secrets must be configured."
            exit 1
          }
          release_fingerprint="$(tr -d '[:space:]' < site/GPG_FINGERPRINT.txt)"
          expected_fingerprint="$(printf '%s' "$GPG_FINGERPRINT" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          [[ "$release_fingerprint" == "$expected_fingerprint" ]] || {
            echo "::error::The newest release's fingerprint does not match the configured GPG signing key."
            exit 1
          }

          # Write directly into the mounted Pages directory. Do not stream generated files
          # through Docker stdout: that was the source of the truncated/empty archive failures.
          docker run --rm -i --user 0:0 \
            --volume "$GITHUB_WORKSPACE/site/x86_64:/repo" \
            --volume "$GITHUB_WORKSPACE/site:/site-meta" \
            --env GPG_PRIVATE_KEY \
            --env GPG_PASSPHRASE \
            --env GPG_FINGERPRINT \
            archlinux:latest bash -euo pipefail -s <<'CONTAINER_SCRIPT'
          set -euo pipefail
          pacman -Sy --noconfirm --needed gnupg >&2
          command -v repo-add >/dev/null || {
            echo "repo-add is not available in the Arch Linux container." >&2
            exit 1
          }

          install -d -m 700 /root/.gnupg
          chmod 700 /root/.gnupg
          printf '%s' "$GPG_PRIVATE_KEY" | /usr/bin/gpg --batch --import >&2
          expected="$(printf '%s' "$GPG_FINGERPRINT" | tr '[:lower:]' '[:upper:]' | tr -d '[:space:]')"
          actual="$(/usr/bin/gpg --batch --with-colons --fingerprint "$expected" | awk -F: '$1 == "fpr" { print $10; exit }')"
          secret="$(/usr/bin/gpg --batch --with-colons --list-secret-keys "$expected" | awk -F: '$1 == "fpr" { print $10; exit }')"
          [[ -n "$actual" && "$actual" == "$expected" && "$secret" == "$expected" ]] || {
            echo "The imported signing key does not match GPG_FINGERPRINT or lacks its private key." >&2
            exit 1
          }

          cd /repo
          shopt -s nullglob
          packages=(*.pkg.tar.zst)
          [[ "${#packages[@]}" -ge 1 && "${#packages[@]}" -le 2 ]] || {
            echo "Expected one or two packages in the repository directory; found ${#packages[@]}." >&2
            exit 1
          }
          for package in "${packages[@]}"; do
            [[ -s "${package}.sig" ]] || {
              echo "Missing package signature: ${package}.sig" >&2
              exit 1
            }
            # Verify each downloaded release package before including it in the database.
            /usr/bin/gpg --batch --verify "${package}.sig" "$package" >&2
          done

          # Remove stale repository outputs before generating a fresh signed database.
          rm -f kwin-no-tiles.db kwin-no-tiles.db.sig \
            kwin-no-tiles.db.tar.gz kwin-no-tiles.db.tar.gz.sig SHA256SUMS

          if [[ -n "$GPG_PASSPHRASE" ]]; then
            umask 077
            printf '%s\n' "$GPG_PASSPHRASE" > /root/.gnupg/passphrase
            cat > /usr/local/bin/gpg <<'GPG_WRAPPER'
          #!/usr/bin/bash
          exec /usr/bin/gpg --batch --yes --pinentry-mode loopback --passphrase-file /root/.gnupg/passphrase "$@"
          GPG_WRAPPER
          else
            cat > /usr/local/bin/gpg <<'GPG_WRAPPER'
          #!/usr/bin/bash
          exec /usr/bin/gpg --batch --yes "$@"
          GPG_WRAPPER
          fi
          chmod 0755 /usr/local/bin/gpg
          export PATH="/usr/local/bin:$PATH"
          repo-add --sign --include-sigs --key "$expected" kwin-no-tiles.db.tar.gz "${packages[@]}" >&2

          test -s kwin-no-tiles.db.tar.gz
          test -s kwin-no-tiles.db.tar.gz.sig
          /usr/bin/gpg --batch --verify kwin-no-tiles.db.tar.gz.sig kwin-no-tiles.db.tar.gz >&2

          # Replace repo-add's aliases with regular copies for reliable static hosting.
          rm -f kwin-no-tiles.db kwin-no-tiles.db.sig
          cp -f kwin-no-tiles.db.tar.gz kwin-no-tiles.db
          cp -f kwin-no-tiles.db.tar.gz.sig kwin-no-tiles.db.sig

          /usr/bin/gpg --batch --armor --export "$expected" > /site-meta/keys/kwin-no-tiles-signing-key.asc
          printf '%s\n' "$expected" > /site-meta/GPG_FINGERPRINT.txt
          rm -f /root/.gnupg/passphrase
          echo "Repository output files written inside container:" >&2
          find /repo -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort >&2
          CONTAINER_SCRIPT

      - name: Generate and verify repository checksums
        shell: bash
        run: |
          set -euo pipefail
          cd site/x86_64
          shopt -s nullglob
          echo "Repository files visible to the runner after container exit:"
          find . -maxdepth 1 -type f -printf '%f (%s bytes)\n' | sort
          packages=(*.pkg.tar.zst)
          signatures=(*.pkg.tar.zst.sig)
          [[ "${#packages[@]}" -ge 1 && "${#packages[@]}" -le 2 ]] || {
            echo "::error::Expected one or two package files; found ${#packages[@]}."
            exit 1
          }
          [[ "${#signatures[@]}" -eq "${#packages[@]}" ]] || {
            echo "::error::The package and signature counts do not match."
            exit 1
          }

          for file in ${packages[@]} ${signatures[@]} \
            kwin-no-tiles.db kwin-no-tiles.db.sig \
            kwin-no-tiles.db.tar.gz kwin-no-tiles.db.tar.gz.sig; do
            if [[ ! -f "$file" || ! -s "$file" ]]; then
              echo "::error::Required repository file is missing or empty: $file"
              exit 1
            fi
          done
          for alias in kwin-no-tiles.db kwin-no-tiles.db.sig; do
            if [[ -L "$alias" ]]; then
              echo "::error::Repository alias must be a regular file, not a symlink: $alias"
              exit 1
            fi
          done

          # One manifest, generated after the container has written the final published files.
          sha256sum -- "${packages[@]}" "${signatures[@]}" \
            kwin-no-tiles.db kwin-no-tiles.db.sig \
            kwin-no-tiles.db.tar.gz kwin-no-tiles.db.tar.gz.sig > SHA256SUMS
          sha256sum --check SHA256SUMS

          echo "Repository files and SHA-256 checksums verified:"
          printf '%s\n' "${packages[@]}" "${signatures[@]}" \
            kwin-no-tiles.db kwin-no-tiles.db.sig \
            kwin-no-tiles.db.tar.gz kwin-no-tiles.db.tar.gz.sig SHA256SUMS
          cd ../..
          for file in site/x86_64/kwin-no-tiles.db site/x86_64/kwin-no-tiles.db.sig \
            site/x86_64/kwin-no-tiles.db.tar.gz site/x86_64/kwin-no-tiles.db.tar.gz.sig \
            site/x86_64/SHA256SUMS; do
            [[ -s "$file" ]] || {
              echo "::error::Required repository file is missing or empty: $file"
              exit 1
            }
          done

      - name: Create repository installation instructions
        shell: bash
        run: |
          fingerprint="$(tr -d '[:space:]' < site/GPG_FINGERPRINT.txt)"
          cat > site/index.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>KWin NO-TILES CachyOS pacman repository</title>
            <style>body{font:16px/1.55 system-ui,sans-serif;max-width:850px;margin:3rem auto;padding:0 1rem}code,pre{background:#f2f2f2;padding:.2rem .35rem;border-radius:.25rem}pre{padding:1rem;overflow:auto}.fingerprint{overflow-wrap:anywhere}</style>
          </head>
          <body>
            <h1>KWin NO-TILES for CachyOS</h1>
            <p>Signed pacman repository for the KWin NO-TILES package, built for CachyOS x86-64-v3.</p>
            <h2>Signing key</h2>
            <p><a href="keys/kwin-no-tiles-signing-key.asc">Download public signing key</a> · <a href="GPG_FINGERPRINT.txt">Full signing-key fingerprint</a></p>
            <p class="fingerprint"><strong>Fingerprint:</strong> <code>$fingerprint</code></p>
            <p>Before trusting the key, compare its full fingerprint with a maintainer-published source you already trust.</p>
            <h2>1. Import and trust the key</h2>
            <p>Download the key and fingerprint, inspect the key's fingerprint, and only continue if it matches the independently verified fingerprint above.</p>
            <pre><code>curl -fsSLo /tmp/kwin-no-tiles-signing-key.asc \\
              https://bossman22-dxf.github.io/KWin-No-Tiles-cachyOS/keys/kwin-no-tiles-signing-key.asc
          gpg --show-keys --with-fingerprint /tmp/kwin-no-tiles-signing-key.asc
          sudo pacman-key --add /tmp/kwin-no-tiles-signing-key.asc
          sudo pacman-key --lsign-key $fingerprint</code></pre>
            <h2>2. Add the pacman repository</h2>
            <p>Add this section to <code>/etc/pacman.conf</code>:</p>
            <pre><code>[kwin-no-tiles]
          SigLevel = Required
          Server = https://bossman22-dxf.github.io/KWin-No-Tiles-cachyOS/\$arch</code></pre>
            <p>Then synchronise and install:</p>
            <pre><code>sudo pacman -Syu
          sudo pacman -S kwin-no-tiles</code></pre>
            <p><strong>Important:</strong> this package conflicts with and replaces the stock <code>kwin</code> package. Keep a rollback copy of the previous working package. The build checks pass, but runtime testing on the maintainer's desktop has not been performed.</p>
            <p><a href="x86_64/SHA256SUMS">Repository package/database SHA-256 manifest</a></p>
          </body>
          </html>
          HTML
          cat > site/README.txt <<TXT
          KWin NO-TILES CachyOS pacman repository
          Repository URL: https://bossman22-dxf.github.io/KWin-No-Tiles-cachyOS/\$arch
          Signing-key fingerprint: $fingerprint

          See the website index.html for the key import, fingerprint-checking, pacman configuration,
          and installation steps. Package and database signatures are required.
          TXT

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
